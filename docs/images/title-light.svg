<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc"><title id="title">HingeGlass</title><desc id="desc">A little motion. A softer view.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.shine{opacity:0;animation:sweep 7s ease-in-out infinite}.subtitle{animation:breathe 7s ease-in-out infinite}@keyframes sweep{0%,12%{transform:translateX(-650px);opacity:0}18%{opacity:1}48%{transform:translateX(650px);opacity:1}52%,100%{transform:translateX(650px);opacity:0}}@keyframes breathe{0%,55%,100%{opacity:1}30%{opacity:.82}}@media(prefers-reduced-motion:reduce){.shine{display:none}.subtitle{animation:none}}</style><text class="title" x="480" y="94" text-anchor="middle" font-size="76" font-weight="600" letter-spacing="-3" fill="#172438">HingeGlass</text><text class="subtitle" x="480" y="142" text-anchor="middle" font-size="24" letter-spacing=".5" fill="#57687c">A little motion. A softer view.</text><defs><clipPath id="letters"><text x="480" y="94" text-anchor="middle" font-size="76" font-weight="600" letter-spacing="-3">HingeGlass</text></clipPath><linearGradient id="light"><stop stop-color="#287ab4" stop-opacity="0"/><stop offset=".5" stop-color="#287ab4"/><stop offset="1" stop-color="#287ab4" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#letters)" aria-hidden="true"><rect class="shine" x="350" y="20" width="260" height="90" fill="url(#light)"/></g></svg>