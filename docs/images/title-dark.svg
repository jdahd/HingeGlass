<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc"><title id="title">HingeGlass</title><desc id="desc">A little motion. A softer view.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.title{animation:clarity 1.6s cubic-bezier(.22,1,.36,1) both}.subtitle{animation:soft 1.1s .65s ease-out both}@keyframes clarity{from{opacity:0;filter:blur(9px);transform:translateY(6px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes soft{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.title,.subtitle{animation:none}}</style><text class="title" x="480" y="94" text-anchor="middle" font-size="76" font-weight="600" letter-spacing="-3" fill="#edf5ff">HingeGlass</text><text class="subtitle" x="480" y="142" text-anchor="middle" font-size="24" letter-spacing=".5" fill="#a8bacd">A little motion. A softer view.</text></svg>