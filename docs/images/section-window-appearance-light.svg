<svg xmlns="http://www.w3.org/2000/svg" width="360" height="54" viewBox="0 0 360 54" role="img" aria-label="Window appearance"><style>.words{animation:tint 7s ease-in-out infinite}.line{transform-origin:0 0;animation:glide 7s ease-in-out infinite}@keyframes tint{0%,60%,100%{fill:#172438}28%{fill:#287ab4}}@keyframes glide{0%,60%,100%{transform:scaleX(1)}28%{transform:scaleX(1.75)}}@media(prefers-reduced-motion:reduce){.words,.line{animation:none}}</style><text class="words" x="0" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#172438">Window appearance</text><rect class="line" y="43" width="44" height="2" rx="1" fill="#287ab4"/></svg>