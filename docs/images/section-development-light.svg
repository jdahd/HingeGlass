<svg xmlns="http://www.w3.org/2000/svg" width="360" height="54" viewBox="0 0 360 54" role="img" aria-label="Development"><style>.words{animation:arrive .9s ease-out both}.line{transform-origin:0 0;animation:grow 1.2s .25s ease-out both}@keyframes arrive{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:translateX(0)}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.words,.line{animation:none}}</style><text class="words" x="0" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#172438">Development</text><rect class="line" y="43" width="44" height="2" rx="1" fill="#287ab4"/></svg>