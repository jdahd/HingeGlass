name: Windows preview
on:
  push:
    paths: ['windows/**', '.github/workflows/windows-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable x64 app
        shell: pwsh
        run: dotnet publish windows/HingeGlass.Windows/HingeGlass.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/HingeGlass-Windows
      - name: Validate effect and launch UI
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/HingeGlass-Windows/HingeGlass.exe).Path
          foreach ($mode in @('--self-test','--ui-smoke')) {
            $process = Start-Process $exe -ArgumentList $mode -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "$mode timed out" }
            if ($process.ExitCode -ne 0) { throw "$mode failed: $($process.ExitCode)" }
          }
          if (!(Test-Path windows-preview.png)) { throw 'Missing rendered preview' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item windows/README.md dist/HingeGlass-Windows/README.md
          Copy-Item ThirdPartyNotices/Macbook_Duo_Effect.txt dist/HingeGlass-Windows/ThirdPartyNotices.txt
          Compress-Archive -Path dist/HingeGlass-Windows -DestinationPath HingeGlass-0.1.4-Windows-x64-preview.zip
          $hash = (Get-FileHash HingeGlass-0.1.4-Windows-x64-preview.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  HingeGlass-0.1.4-Windows-x64-preview.zip" | Set-Content HingeGlass-0.1.4-Windows-x64-preview.zip.sha256
      - name: Build branded installer and test installation
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler missing' }
          & $compiler windows/installer/HingeGlass.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
          $setup = (Resolve-Path installer-output/HingeGlass-0.1.4-Windows-x64-Setup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'HingeGlass-Install-Test'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir") -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Install timed out' }
          if ($process.ExitCode -ne 0) { throw 'Install failed' }
          foreach ($mode in @('--self-test','--ui-smoke')) {
            $p = Start-Process "$installDir/HingeGlass.exe" -ArgumentList $mode -PassThru
            if (!$p.WaitForExit(30000)) { $p.Kill(); throw 'Installed app timed out' }
            if ($p.ExitCode -ne 0) { throw 'Installed app failed' }
          }
          $uninstall = Start-Process "$installDir/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
          if (!$uninstall.WaitForExit(60000)) { $uninstall.Kill(); throw 'Uninstall timed out' }
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$installDir/HingeGlass.exe")) { throw 'Uninstall failed' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  HingeGlass-0.1.4-Windows-x64-Setup.exe" | Set-Content "$setup.sha256"
      - name: Build and verify animated Setup experience
        shell: pwsh
        run: |
          dotnet publish windows/HingeGlass.Setup/HingeGlass.Setup.csproj -c Release -r win-x64 --self-contained true -o bootstrapper-output
          if ($LASTEXITCODE) { throw 'Setup build failed' }
          $setup = (Resolve-Path bootstrapper-output/HingeGlass-0.1.4-Windows-x64-Setup.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'HingeGlass-Branded-Test'
          $p = Start-Process $setup -ArgumentList @('--installer-smoke','--test-dir', $target) -PassThru
          if (!$p.WaitForExit(240000)) { $p.Kill(); throw 'Animated Setup timed out' }
          if ($p.ExitCode -ne 0) { throw 'Animated Setup installation failed' }
          foreach ($mode in @('--self-test','--ui-smoke')) {
            $app = Start-Process "$target/HingeGlass.exe" -ArgumentList $mode -PassThru
            if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'Installed app timed out' }
            if ($app.ExitCode -ne 0) { throw 'Installed app test failed' }
          }
          $u = Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (!$u.WaitForExit(60000)) { $u.Kill(); throw 'Uninstall timed out' }
          if ($u.ExitCode -ne 0 -or (Test-Path "$target/HingeGlass.exe")) { throw 'Uninstall failed' }
          Copy-Item $setup installer-output/HingeGlass-0.1.4-Windows-x64-Setup.exe -Force
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  HingeGlass-0.1.4-Windows-x64-Setup.exe" | Set-Content installer-output/HingeGlass-0.1.4-Windows-x64-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: |
            HingeGlass-0.1.4-Windows-x64-preview.zip
            HingeGlass-0.1.4-Windows-x64-preview.zip.sha256
            windows-preview.png
            installer-preview.png
            installer-output/HingeGlass-0.1.4-Windows-x64-Setup.exe
            installer-output/HingeGlass-0.1.4-Windows-x64-Setup.exe.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: installer-design-review
          path: |
            installer-preview.png
            installer-progress.png
            installer-finished.png
          retention-days: 7
